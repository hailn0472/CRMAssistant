name: Deploy

on:
  push:
    branches: [main, staging]

env:
  CI: true
  INFISICAL_PROJECT_ID: 03a6e175-bbe1-412c-b6df-31574c26ed57

jobs:
  validate-deploy-production:
    name: Validate Production Deployment Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter=api exec prisma generate

      - name: Run lint
        run: pnpm lint

      - name: Run type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Run API tests
        env:
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          FRONTEND_URL: http://localhost:3000
          TESTCONTAINERS_RYUK_DISABLED: true
        run: pnpm test:api --filter=api

      - name: Build all workspaces
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          WEB_SESSION_SECRET: ${{ secrets.WEB_SESSION_SECRET || 'ci-web-session-secret-minimum-32-chars' }}
        run: pnpm build

  validate-deploy-staging:
    name: Validate Staging Deployment Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter=api exec prisma generate

      - name: Run lint
        run: pnpm lint

      - name: Run type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Run API tests
        env:
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          FRONTEND_URL: http://localhost:3000
          TESTCONTAINERS_RYUK_DISABLED: true
        run: pnpm test:api --filter=api

      - name: Build all workspaces
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING || 'placeholder-anon-key' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_STAGING || 'http://localhost:4000' }}
          WEB_SESSION_SECRET: ${{ secrets.WEB_SESSION_SECRET_STAGING || 'ci-web-session-secret-minimum-32-chars' }}
        run: pnpm build

  deploy-backend-production:
    name: Deploy Backend Production (Render)
    runs-on: ubuntu-latest
    needs: validate-deploy-production
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render production deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Skip production backend deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "Skipping production backend deploy — RENDER_DEPLOY_HOOK_URL is not configured."

  deploy-backend-staging:
    name: Deploy Backend Staging (Render)
    runs-on: ubuntu-latest
    needs: validate-deploy-staging
    if: github.ref == 'refs/heads/staging'
    environment: staging
    env:
      RENDER_DEPLOY_HOOK_URL_STAGING: ${{ secrets.RENDER_DEPLOY_HOOK_URL_STAGING }}
    steps:
      - name: Trigger Render staging deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL_STAGING != '' }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL_STAGING"

      - name: Skip staging backend deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL_STAGING == '' }}
        run: echo "Skipping staging backend deploy — RENDER_DEPLOY_HOOK_URL_STAGING is not configured."

  deploy-frontend-production:
    name: Deploy Frontend Production (Vercel)
    runs-on: ubuntu-latest
    needs: deploy-backend-production
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install -g vercel@latest

      - name: Deploy production frontend to Vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Skip production frontend deploy
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        run: echo "Skipping production frontend deploy — Vercel deployment secrets are not configured."

  deploy-frontend-staging:
    name: Deploy Frontend Staging (Vercel Preview)
    runs-on: ubuntu-latest
    needs: deploy-backend-staging
    if: github.ref == 'refs/heads/staging'
    environment: staging
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STAGING || secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install -g vercel@latest

      - name: Pull Vercel preview environment
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Deploy staging frontend to Vercel preview
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: vercel deploy --yes --token="$VERCEL_TOKEN"

      - name: Skip staging frontend deploy
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        run: echo "Skipping staging frontend deploy — Vercel deployment secrets are not configured."

