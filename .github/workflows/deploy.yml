name: Deploy

on:
  push:
    branches: [main, staging]

env:
  CI: true
  INFISICAL_PROJECT_ID: 03a6e175-bbe1-412c-b6df-31574c26ed57

jobs:
  validate-deploy-production:
    name: Validate Production Deployment Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter=api exec prisma generate

      - name: Run lint
        run: pnpm lint

      - name: Run type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Run API tests
        env:
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          FRONTEND_URL: http://localhost:3000
          TESTCONTAINERS_RYUK_DISABLED: true
        run: pnpm test:api --filter=api

      - name: Build all workspaces
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          WEB_SESSION_SECRET: ${{ secrets.WEB_SESSION_SECRET || 'ci-web-session-secret-minimum-32-chars' }}
        run: pnpm build

  validate-deploy-staging:
    name: Validate Staging Deployment Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter=api exec prisma generate

      - name: Run lint
        run: pnpm lint

      - name: Run type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Run API tests
        env:
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          FRONTEND_URL: http://localhost:3000
          TESTCONTAINERS_RYUK_DISABLED: true
        run: pnpm test:api --filter=api

      - name: Build all workspaces
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING || 'placeholder-anon-key' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_STAGING || 'http://localhost:4000' }}
          WEB_SESSION_SECRET: ${{ secrets.WEB_SESSION_SECRET_STAGING || 'ci-web-session-secret-minimum-32-chars' }}
        run: pnpm build

