name: Deploy

on:
  push:
    branches: [main, staging]

env:
  CI: true
  INFISICAL_PROJECT_ID: 03a6e175-bbe1-412c-b6df-31574c26ed57

jobs:
  validate-deploy-production:
    name: Validate Production Deployment Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter=api exec prisma generate

      - name: Run lint
        run: pnpm lint

      - name: Run type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Run API tests
        env:
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          FRONTEND_URL: http://localhost:3000
          TESTCONTAINERS_RYUK_DISABLED: true
        run: pnpm test:api --filter=api

      - name: Build all workspaces
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          WEB_SESSION_SECRET: ${{ secrets.WEB_SESSION_SECRET || 'ci-web-session-secret-minimum-32-chars' }}
        run: pnpm build

  validate-deploy-staging:
    name: Validate Staging Deployment Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter=api exec prisma generate

      - name: Run lint
        run: pnpm lint

      - name: Run type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Run API tests
        env:
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          FRONTEND_URL: http://localhost:3000
          TESTCONTAINERS_RYUK_DISABLED: true
        run: pnpm test:api --filter=api

      - name: Build all workspaces
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING || 'placeholder-anon-key' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_STAGING || 'http://localhost:4000' }}
          WEB_SESSION_SECRET: ${{ secrets.WEB_SESSION_SECRET_STAGING || 'ci-web-session-secret-minimum-32-chars' }}
        run: pnpm build

  deploy-backend-production:
    name: Deploy Backend Production (Render)
    runs-on: ubuntu-latest
    needs: validate-deploy-production
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_API_URL: ${{ secrets.INFISICAL_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter=api exec prisma generate

      - name: Install Infisical CLI
        if: ${{ env.INFISICAL_CLIENT_ID != '' && env.INFISICAL_CLIENT_SECRET != '' }}
        run: npm install -g @infisical/cli

      - name: Authenticate Infisical
        if: ${{ env.INFISICAL_CLIENT_ID != '' && env.INFISICAL_CLIENT_SECRET != '' }}
        run: |
          token=$(infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --silent \
            --plain)
          echo "INFISICAL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Export production backend secrets
        if: ${{ env.INFISICAL_TOKEN != '' }}
        run: infisical export --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/apps/api --format=dotenv >> "$GITHUB_ENV"

      - name: Export production CI secrets
        if: ${{ env.INFISICAL_TOKEN != '' }}
        run: infisical export --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/ci --format=dotenv >> "$GITHUB_ENV"

      - name: Run production Prisma migrations
        if: ${{ env.INFISICAL_TOKEN != '' }}
        timeout-minutes: 10
        run: pnpm --filter=api exec prisma migrate deploy

      - name: Deploy production backend to Render
        if: ${{ env.INFISICAL_TOKEN != '' && env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Skip production backend deploy (Infisical not configured)
        if: ${{ env.INFISICAL_TOKEN == '' || env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "Skipping production backend deploy — Infisical bootstrap or RENDER_DEPLOY_HOOK_URL is not configured."

  deploy-backend-staging:
    name: Deploy Backend Staging (Render)
    runs-on: ubuntu-latest
    needs: validate-deploy-staging
    if: github.ref == 'refs/heads/staging'
    environment: staging
    env:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_API_URL: ${{ secrets.INFISICAL_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter=api exec prisma generate

      - name: Install Infisical CLI
        if: ${{ env.INFISICAL_CLIENT_ID != '' && env.INFISICAL_CLIENT_SECRET != '' }}
        run: npm install -g @infisical/cli

      - name: Authenticate Infisical
        if: ${{ env.INFISICAL_CLIENT_ID != '' && env.INFISICAL_CLIENT_SECRET != '' }}
        run: |
          token=$(infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --silent \
            --plain)
          echo "INFISICAL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Export staging backend secrets
        if: ${{ env.INFISICAL_TOKEN != '' }}
        run: infisical export --projectId="$INFISICAL_PROJECT_ID" --env=staging --path=/apps/api --format=dotenv >> "$GITHUB_ENV"

      - name: Export staging CI secrets
        if: ${{ env.INFISICAL_TOKEN != '' }}
        run: infisical export --projectId="$INFISICAL_PROJECT_ID" --env=staging --path=/ci --format=dotenv >> "$GITHUB_ENV"

      - name: Run staging Prisma migrations
        if: ${{ env.INFISICAL_TOKEN != '' }}
        timeout-minutes: 10
        run: pnpm --filter=api exec prisma migrate deploy

      - name: Deploy staging backend to Render
        if: ${{ env.INFISICAL_TOKEN != '' && env.RENDER_DEPLOY_HOOK_URL_STAGING != '' }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL_STAGING"

      - name: Skip staging backend deploy (Infisical not configured)
        if: ${{ env.INFISICAL_TOKEN == '' || env.RENDER_DEPLOY_HOOK_URL_STAGING == '' }}
        run: echo "Skipping staging backend deploy — Infisical bootstrap or RENDER_DEPLOY_HOOK_URL_STAGING is not configured."

  deploy-frontend-production:
    name: Deploy Frontend Production (Vercel)
    runs-on: ubuntu-latest
    needs: deploy-backend-production
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_API_URL: ${{ secrets.INFISICAL_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Infisical CLI
        if: ${{ env.INFISICAL_CLIENT_ID != '' && env.INFISICAL_CLIENT_SECRET != '' }}
        run: npm install -g @infisical/cli

      - name: Authenticate Infisical
        if: ${{ env.INFISICAL_CLIENT_ID != '' && env.INFISICAL_CLIENT_SECRET != '' }}
        run: |
          token=$(infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --silent \
            --plain)
          echo "INFISICAL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Export production web secrets
        if: ${{ env.INFISICAL_TOKEN != '' }}
        run: infisical export --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/apps/web --format=dotenv >> "$GITHUB_ENV"

      - name: Export production CI secrets
        if: ${{ env.INFISICAL_TOKEN != '' }}
        run: infisical export --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/ci --format=dotenv >> "$GITHUB_ENV"

      - name: Install Vercel CLI
        if: ${{ env.INFISICAL_TOKEN != '' && env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npm install -g vercel@latest

      - name: Deploy production frontend to Vercel
        if: ${{ env.INFISICAL_TOKEN != '' && env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Skip production frontend deploy (Infisical not configured)
        if: ${{ env.INFISICAL_TOKEN == '' || env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        run: echo "Skipping production frontend deploy — Infisical bootstrap or Vercel deployment secrets are not configured."

  deploy-frontend-staging:
    name: Deploy Frontend Staging (Vercel Preview)
    runs-on: ubuntu-latest
    needs: deploy-backend-staging
    if: github.ref == 'refs/heads/staging'
    environment: staging
    env:
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_API_URL: ${{ secrets.INFISICAL_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Infisical CLI
        if: ${{ env.INFISICAL_CLIENT_ID != '' && env.INFISICAL_CLIENT_SECRET != '' }}
        run: npm install -g @infisical/cli

      - name: Authenticate Infisical
        if: ${{ env.INFISICAL_CLIENT_ID != '' && env.INFISICAL_CLIENT_SECRET != '' }}
        run: |
          token=$(infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --silent \
            --plain)
          echo "INFISICAL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Export staging web secrets
        if: ${{ env.INFISICAL_TOKEN != '' }}
        run: infisical export --projectId="$INFISICAL_PROJECT_ID" --env=staging --path=/apps/web --format=dotenv >> "$GITHUB_ENV"

      - name: Export staging CI secrets
        if: ${{ env.INFISICAL_TOKEN != '' }}
        run: infisical export --projectId="$INFISICAL_PROJECT_ID" --env=staging --path=/ci --format=dotenv >> "$GITHUB_ENV"

      - name: Install Vercel CLI
        if: ${{ env.INFISICAL_TOKEN != '' && env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID_STAGING != '' }}
        run: npm install -g vercel@latest

      - name: Pull Vercel preview environment
        if: ${{ env.INFISICAL_TOKEN != '' && env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID_STAGING != '' }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID_STAGING }}

      - name: Deploy staging frontend to Vercel preview
        if: ${{ env.INFISICAL_TOKEN != '' && env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID_STAGING != '' }}
        run: |
          preview_url=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          echo "Vercel preview URL: $preview_url"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID_STAGING }}

      - name: Skip staging frontend deploy (Infisical not configured)
        if: ${{ env.INFISICAL_TOKEN == '' || env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID_STAGING == '' }}
        run: echo "Skipping staging frontend deploy — Infisical bootstrap or Vercel deployment secrets are not configured."
