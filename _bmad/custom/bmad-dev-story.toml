[workflow]
on_complete = "If the completed story changes user-facing UI, capture review screenshots for desktop, tablet, and mobile viewports when the app can be run locally. Save them under `{project-root}/docs/pr-screenshots/<story-key>/` using names like `desktop-<screen>.png`, `tablet-<screen>.png`, and `mobile-<screen>.png` so the files can be committed and referenced from pull requests. Add a `Screenshot Evidence` section to the story Dev Agent Record with the saved paths and include the same paths in the PR screenshots section. If screenshots cannot be captured, record the blocker and the command/env needed to retry."
